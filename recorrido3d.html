<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Recorrido Virtual 3D — Mate &amp; Café</title>
<style>
/* ============================================================
   INTERFAZ HTML SUPERPUESTA (no dibujada en 3D)
   Identidad Mate & Café: papel cálido, verde yerba, cuero, madera.
   ============================================================ */
:root{
  --crema:#FDFBF7; --crema-2:#EFEAE1; --crema-3:#E4DCCF;
  --madera:#C8B29B; --madera-osc:#A98D74;
  --cafe:#5C4033; --cafe-cl:#7A5A48;
  --yerba:#3B5E2B; --yerba-cl:#8BA870;
  --acero:#8A8F92; --cuero:#9C6B43;
  --tinta:#2E241D; --tinta-sv:#6B5A4E; --linea:#DCD2C4;
  --font-d:Georgia,"Times New Roman",serif;
  --font-b:system-ui,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0906}
body{font-family:var(--font-b);color:var(--tinta);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
canvas{display:block;outline:none;touch-action:none}

#lienzo{position:fixed;inset:0}

/* ---- pantalla de carga ---- */
#carga{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 30%,#3a2c20 0%,#1c140e 70%);color:var(--crema);transition:opacity .5s ease}
#carga.oculto{opacity:0;pointer-events:none}
#carga h1{font-family:var(--font-d);font-weight:600;font-size:26px;margin:0 0 6px;letter-spacing:.02em}
#carga p{margin:0 0 22px;color:var(--madera);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.barra-carga{width:min(320px,70vw);height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.barra-carga i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--yerba-cl),var(--cuero));
  transition:width .25s ease;border-radius:999px}
#carga small{margin-top:12px;color:rgba(253,251,247,.55);font-size:11px;letter-spacing:.08em}

/* ---- barra superior ---- */
#barra-sup{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:linear-gradient(180deg,rgba(46,36,29,.82),rgba(46,36,29,0));pointer-events:none}
#barra-sup .marca{display:flex;flex-direction:column;line-height:1.1;pointer-events:auto;margin-right:auto}
#barra-sup .marca b{font-family:var(--font-d);font-size:16px;color:#fff;font-weight:600}
#barra-sup .marca span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--madera)}
#barra-sup .btn{pointer-events:auto;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
  background:rgba(253,251,247,.12);border:1px solid rgba(253,251,247,.28);color:#fff;font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;font-weight:600;backdrop-filter:blur(4px)}
#barra-sup .btn:hover{background:rgba(253,251,247,.22)}
#barra-sup .btn[aria-pressed="true"]{background:var(--yerba);border-color:var(--yerba)}

/* ---- letrero de zona (fundido) ---- */
#letrero-zona{position:fixed;top:64px;left:50%;transform:translate(-50%,-8px);z-index:19;
  padding:9px 22px;border-radius:999px;background:rgba(46,36,29,.72);color:#fff;
  font-family:var(--font-d);font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  opacity:0;transition:opacity .5s ease,transform .5s ease;pointer-events:none;white-space:nowrap}
#letrero-zona.visible{opacity:1;transform:translate(-50%,0)}

/* ---- ayuda ---- */
#panel-ayuda{position:fixed;top:60px;right:14px;z-index:20;width:230px;background:rgba(253,251,247,.96);
  border:1px solid var(--linea);border-radius:12px;padding:14px 16px;font-size:12px;line-height:1.7;
  box-shadow:0 20px 40px -24px rgba(0,0,0,.5);transition:opacity .2s,transform .2s}
#panel-ayuda.oculto{opacity:0;pointer-events:none;transform:translateY(-6px)}
#panel-ayuda h4{margin:0 0 8px;font-family:var(--font-d);font-size:14px;color:var(--yerba)}
#panel-ayuda b{color:var(--cafe)}
#panel-ayuda .cerrar{position:absolute;top:8px;right:10px;font-size:16px;color:var(--tinta-sv)}

/* ---- joystick móvil ---- */
#joystick{position:fixed;left:22px;bottom:22px;z-index:20;width:110px;height:110px;border-radius:50%;
  background:rgba(253,251,247,.14);border:1px solid rgba(253,251,247,.3);display:none;touch-action:none}
#joystick.activo{display:block}
#joystick .palo{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;
  background:rgba(253,251,247,.85);transform:translate(-50%,-50%)}

/* ---- minimapa ---- */
#minimapa-cont{position:fixed;right:14px;bottom:14px;z-index:20;border-radius:12px;overflow:hidden;
  border:2px solid rgba(253,251,247,.5);box-shadow:0 16px 34px -18px rgba(0,0,0,.6)}
#minimapa{display:block;background:#20140c}

/* ---- tooltip flotante (raycaster) ---- */
#tooltip{position:fixed;z-index:25;padding:5px 11px;border-radius:999px;background:var(--tinta);color:#fff;
  font-size:11.5px;letter-spacing:.05em;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;
  transform:translate(-50%,-130%)}
#tooltip.visible{opacity:1}

/* ---- panel de diálogo NPC ---- */
#dialogo-fondo{position:fixed;inset:0;z-index:40;background:rgba(20,14,9,.55);display:none;
  align-items:flex-end;justify-content:center;padding:18px}
#dialogo-fondo.abierto{display:flex}
#panel-dialogo{width:min(460px,100%);background:var(--crema);border:1px solid var(--linea);border-radius:16px 16px 8px 8px;
  padding:20px 22px;box-shadow:0 -20px 60px -20px rgba(0,0,0,.5);animation:subir .3s ease both}
@keyframes subir{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#panel-dialogo .npc-cab{display:flex;align-items:center;gap:11px;margin-bottom:10px}
#panel-dialogo .npc-av{width:40px;height:40px;border-radius:50%;flex:none}
#panel-dialogo .npc-nom{font-family:var(--font-d);font-weight:600;font-size:16px;line-height:1.1}
#panel-dialogo .npc-sub{font-size:11px;color:var(--tinta-sv);letter-spacing:.04em}
#panel-dialogo .npc-msg{font-size:14.5px;line-height:1.5;margin:0 0 14px}
#lista-opciones{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.op-dialogo{text-align:left;padding:11px 14px;border:1px solid var(--linea);border-radius:10px;background:#fff;
  font-size:13px;transition:border-color .15s,background .15s}
.op-dialogo:hover{border-color:var(--yerba);background:var(--crema-2)}
#acciones-dialogo{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn-dlg{padding:10px 16px;border-radius:999px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;border:1px solid var(--linea)}
.btn-dlg.primario{background:var(--yerba);border-color:var(--yerba);color:#fff}
.btn-dlg.secundario{background:#fff;color:var(--cafe)}
#leyenda-dialogo{margin-top:12px;font-size:10px;color:var(--tinta-sv);opacity:.75;line-height:1.4}

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:60;padding:11px 20px;
  border-radius:999px;background:var(--yerba);color:#fff;font-size:12.5px;letter-spacing:.04em;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.visible{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  #panel-ayuda{display:none}
  #minimapa-cont{transform:scale(.82);transform-origin:bottom right}
}
</style>
</head>
<body>

<canvas id="lienzo"></canvas>

<!-- pantalla de carga -->
<div id="carga">
  <h1>Mate &amp; Café</h1>
  <p>Preparando el recorrido virtual</p>
  <div class="barra-carga"><i id="barra-carga-i"></i></div>
  <small id="carga-txt">Cargando…</small>
</div>

<!-- barra superior -->
<div id="barra-sup">
  <div class="marca"><b>Mate &amp; Café</b><span>Recorrido virtual 3D</span></div>
  <button class="btn" id="btn-camara" aria-pressed="false">Cámara: 3ª persona</button>
  <button class="btn" id="btn-ayuda-toggle">Ayuda (H)</button>
</div>

<div id="letrero-zona"></div>

<!-- ayuda -->
<div id="panel-ayuda" class="oculto">
  <span class="cerrar" id="ayuda-cerrar">✕</span>
  <h4>Controles</h4>
  <div><b>WASD / flechas</b> — caminar</div>
  <div><b>Shift</b> — correr</div>
  <div><b>Click en el piso</b> — ir hasta ahí</div>
  <div><b>Arrastrar (modo órbita)</b> — girar cámara</div>
  <div><b>Botón cámara</b> — 3ª persona ⇄ órbita</div>
  <div><b>F</b> — pantalla completa</div>
  <div><b>H</b> — mostrar/ocultar ayuda</div>
</div>

<!-- joystick móvil -->
<div id="joystick"><div class="palo" id="joystick-palo"></div></div>

<!-- minimapa -->
<div id="minimapa-cont"><canvas id="minimapa" width="150" height="176"></canvas></div>

<div id="tooltip"></div>

<!-- diálogo NPC -->
<div id="dialogo-fondo">
  <div id="panel-dialogo">
    <div class="npc-cab">
      <div class="npc-av" id="dlg-avatar"></div>
      <div><div class="npc-nom" id="dlg-nombre"></div><div class="npc-sub" id="dlg-subtitulo"></div></div>
    </div>
    <p class="npc-msg" id="dlg-mensaje"></p>
    <div id="lista-opciones"></div>
    <div id="acciones-dialogo"></div>
    <div id="leyenda-dialogo"></div>
  </div>
</div>

<div id="toast"></div>

function texturaMadera(colorBase, colorVeta){
  const c = document.createElement("canvas"); c.width = 128; c.height = 128;
  const ctx = c.getContext("2d");
  ctx.fillStyle = colorBase; ctx.fillRect(0,0,128,128);
  ctx.strokeStyle = colorVeta; ctx.globalAlpha = 0.35;
  for(let i=0;i<14;i++){
    ctx.beginPath(); ctx.lineWidth = 1 + Math.random()*1.5;
    const y = i*9 + Math.random()*4;
    ctx.moveTo(0,y); ctx.bezierCurveTo(40,y+6,88,y-6,128,y); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2,2);
  return tex;
}
function texturaPiso(colorBase, colorLinea){
  const c = document.createElement("canvas"); c.width = 256; c.height = 256;
  const ctx = c.getContext("2d");
  ctx.fillStyle = colorBase; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle = colorLinea; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
  for(let i=0;i<=256;i+=64){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke(); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(cfg.anchoX/3, cfg.profundoZ/3);
  return tex;
}

/* ============================================================
   5. CONSTRUCTORES DE GEOMETRÍA (todo por código, sin assets)
   ============================================================ */
function caja(w,h,d, material){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function cilindro(rt,rb,h, material, seg=16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), material);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function esfera(r, material, seg=16){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg*0.7), material);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function centroX(rango){ return (rango[0]+rango[1])/2; }
function centroZ(rango){ return (rango[0]+rango[1])/2; }
function ancho(rango){ return rango[1]-rango[0]; }

/* mate de utilería (decoración sobre estantes/mesas) */
function mateUtileria(escala, colorCuerpo){
  const g = new THREE.Group();
  const cuerpo = esfera(1, new THREE.MeshStandardMaterial({color:colorCuerpo,roughness:0.7}));
  cuerpo.scale.set(1,0.95,1); cuerpo.position.y = 1; g.add(cuerpo);
  const borde = cilindro(1.02,0.92,0.28, MAT.madera); borde.position.y = 1.85; g.add(borde);
  const bombilla = cilindro(0.1,0.1,2.1, MAT.acero); bombilla.position.set(0.5,2.3,0); bombilla.rotation.z = -0.4; g.add(bombilla);
  g.scale.setScalar(escala); return g;
}

function construirPiso(){
  ZONAS.forEach(zn=>{

    const piso = new THREE.Mesh(new THREE.BoxGeometry(w,0.2,d), pisoMat(zn.piso));
    piso.position.set(centroX(zn.x), -0.1, centroZ(zn.z));
    piso.receiveShadow = true;
    raiz.add(piso);
  });
}

function construirMuros(){
  const grosor = 0.2;
  const alto = (zn)=> zn && zn.altoDoble ? cfg.muroAltoSalon : cfg.muroAltoNormal;
  // perímetro exterior, con hueco de puerta al frente
  const segmentosFrente = [[0,8],[12,cfg.anchoX]]; // deja el hueco de la puerta [8,12]
  segmentosFrente.forEach(seg=>{
    const w = seg[1]-seg[0];
    if(w<=0) return;
    const m = caja(w, cfg.muroAltoNormal, grosor, MAT.muro);
    m.position.set((seg[0]+seg[1])/2, cfg.muroAltoNormal/2, 0);
    raiz.add(m);
  });
  // muro trasero (salón, doble altura)
  const trasero = caja(cfg.anchoX, cfg.muroAltoSalon, grosor, MAT.muro);
  trasero.position.set(cfg.anchoX/2, cfg.muroAltoSalon/2, cfg.profundoZ);
  raiz.add(trasero);
  // muros laterales por tramos (altura variable según zona)
  const tramosZ = [ [0,6.1,cfg.muroAltoNormal], [6.1,13.5,cfg.muroAltoNormal], [13.5,cfg.profundoZ,cfg.muroAltoSalon] ];
  [0, cfg.anchoX].forEach(x=>{
    tramosZ.forEach(tr=>{
      const d = tr[1]-tr[0];
      const m = caja(grosor, tr[2], d, MAT.muro);
      m.position.set(x, tr[2]/2, (tr[0]+tr[1])/2);
      raiz.add(m);
    });
  });
  // zócalo perimetral
  const zoc1 = caja(cfg.anchoX, 0.25, grosor, MAT.zocalo); zoc1.position.set(cfg.anchoX/2,0.125,0); raiz.add(zoc1);
  const zoc2 = caja(cfg.anchoX, 0.25, grosor, MAT.zocalo); zoc2.position.set(cfg.anchoX/2,0.125,cfg.profundoZ); raiz.add(zoc2);
  // vigas de techo del salón, cada 4 m (detalle de coworking)
  for(let x=2; x<cfg.anchoX; x+=4){
    const viga = caja(0.25, 0.25, ancho([13.5,cfg.profundoZ]), MAT.maderaOsc);
    viga.position.set(x, cfg.muroAltoSalon-0.2, (13.5+cfg.profundoZ)/2);
    raiz.add(viga);
  }
}

function construirMobiliario(){
  MOBILIARIO.forEach(p=>{
    const w = ancho(p.x), d = ancho(p.z), h = p.alto;
    const cx = centroX(p.x), cz = centroZ(p.z);
    const g = new THREE.Group();
    g.position.set(cx, 0, cz);
    raiz.add(g);

    switch(p.tipo){
      case "puertaVidrio": {
        const marco = caja(w+0.5, h+0.4, 0.15, MAT.maderaOsc); marco.position.y = (h+0.4)/2; g.add(marco);
        const vidrio = caja(w-0.3, h-0.3, 0.05, MAT.vidrio); vidrio.position.y = h/2; vidrio.castShadow=false; g.add(vidrio);
        break; }
      case "estanteria": {
        const cuerpo = caja(w,h,d, MAT.madera); cuerpo.position.y = h/2; g.add(cuerpo);
        for(let i=1;i<=3;i++){
          const y = h*i/4;
          const estante = caja(w-0.2, 0.06, d-0.15, MAT.maderaOsc); estante.position.set(0,y,0); g.add(estante);
          const mv = mateUtileria(0.5, i%2? PAL.yerba : PAL.cuero); mv.position.set(-w*0.2, y+0.1, 0); g.add(mv);
        }
        break; }
      case "vitrina": {
        const base = caja(w,h*0.4,d, MAT.maderaOsc); base.position.y = h*0.2; g.add(base);
        const vidrio = caja(w,h*0.6,d, MAT.vidrio); vidrio.position.y = h*0.7; vidrio.castShadow=false; g.add(vidrio);
        const tapa = caja(w+0.15,0.08,d+0.15, MAT.maderaOsc); tapa.position.y = h; g.add(tapa);
        break; }
      case "mesaExhibicion": {
        const tapa = caja(w,0.1,d, MAT.madera); tapa.position.y = h; g.add(tapa);
        [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>{
          const pata = cilindro(0.05,0.05,h,MAT.acero); pata.position.set(s[0]*(w/2-0.3),h/2,s[1]*(d/2-0.3)); g.add(pata);
        });
        for(let i=0;i<3;i++){ const mv = mateUtileria(0.6, i%2?PAL.cafe:PAL.yerba); mv.position.set(-w*0.3+i*w*0.3, h, 0); g.add(mv); }
        break; }
      case "mostrador": case "barra": case "caja": {
        const cuerpo = caja(w,h-0.3,d, MAT.madera); cuerpo.position.y=(h-0.3)/2; g.add(cuerpo);
        const tapa = caja(w+0.15,0.15,d+0.15, MAT.maderaOsc); tapa.position.y=h; g.add(tapa);
        break; }
      case "maquinaCafe": {
        const cuerpo = caja(w,h*0.65,d, MAT.acero); cuerpo.position.y = h*0.325; g.add(cuerpo);
        const campana = caja(w*0.85,h*0.3,d*0.75, new THREE.MeshStandardMaterial({color:"#7A5A48",roughness:0.5})); campana.position.y=h*0.8; g.add(campana);
        for(let i=0;i<2;i++){ const pico = cilindro(0.03,0.03,0.35, MAT.acero); pico.position.set(-w*0.2+i*w*0.4,h*0.6,d/2-0.1); g.add(pico); }
        break; }
      case "mesaCata": case "mesa2": case "mesaComunitaria": case "mesaBaja": {
        const tapa = caja(w,0.08,d, MAT.madera); tapa.position.y = h; g.add(tapa);
        [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>{
          const pata = cilindro(0.05,0.05,h,MAT.maderaOsc); pata.position.set(s[0]*(w/2-0.25),h/2,s[1]*(d/2-0.25)); g.add(pata);
        });
        if(p.tipo!=="mesaBaja"){ const jarra = mateUtileria(0.45, PAL.yerba); jarra.position.set(0,h,0); g.add(jarra); }
        break; }
      case "banqueta": {
        const asiento = cilindro(d/2,d/2,0.1, MAT.cuero); asiento.position.y = h; g.add(asiento);
        const pie = cilindro(0.06,0.09,h-0.1, MAT.acero); pie.position.y=(h-0.1)/2; g.add(pie);
        const aro = new THREE.Mesh(new THREE.TorusGeometry(d/2*0.7,0.03,8,20), MAT.acero); aro.rotation.x=Math.PI/2; aro.position.y=h*0.4; g.add(aro);
        break; }
      case "silla": {
        const asiento = caja(w,0.08,d, MAT.madera); asiento.position.y = h*0.55; g.add(asiento);
        const respaldo = caja(w,h*0.5,0.06, MAT.madera); respaldo.position.set(0,h*0.78,-d/2+0.05); g.add(respaldo);
        [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>{
          const pata = cilindro(0.03,0.03,h*0.55, MAT.maderaOsc); pata.position.set(s[0]*(w/2-0.05),h*0.275,s[1]*(d/2-0.05)); g.add(pata);
        });
        break; }
      case "sofa": {
        const base = caja(w,h*0.45,d, MAT.tela); base.position.y=h*0.225; g.add(base);
        const respaldo = caja(w,h*0.65,d*0.22, MAT.tela); respaldo.position.set(0,h*0.65,-d/2+d*0.11); g.add(respaldo);
        const brazo1 = caja(w*0.12,h*0.55,d, MAT.tela); brazo1.position.set(-w/2+w*0.06,h*0.55,0); g.add(brazo1);
        const brazo2 = brazo1.clone(); brazo2.position.x = w/2-w*0.06; g.add(brazo2);
        break; }
      case "box": {
        const base = caja(w,h,d, MAT.cuero); base.position.y = h/2; base.material = new THREE.MeshStandardMaterial({color:PAL.cuero,roughness:0.8,transparent:true,opacity:0.9}); g.add(base);
        const mesaBox = caja(w*0.7,0.06,d*0.5, MAT.madera); mesaBox.position.set(0,0.75,0); g.add(mesaBox);
        break; }
      case "barraEnchufes": {
        const cuerpo = caja(w,h,d, MAT.maderaOsc); cuerpo.position.y=h/2; g.add(cuerpo);
        const tapa = caja(w+0.1,0.06,d+0.1, MAT.madera); tapa.position.y=h; g.add(tapa);
        break; }
      case "planta": {
        const maceta = cilindro(0.28,0.22,0.4, MAT.cuero); maceta.position.y=0.2; g.add(maceta);
        const tallo = cilindro(0.04,0.04,h*0.5, MAT.maderaOsc); tallo.position.y=h*0.45; g.add(tallo);
        const follaje = esfera(0.55, MAT.hoja); follaje.position.y=h*0.85; follaje.scale.y=0.8; g.add(follaje);
        const follaje2 = esfera(0.35, MAT.hoja); follaje2.position.set(0.3,h*0.7,-0.2); g.add(follaje2);
        break; }
      case "cartel": {
        const panel = caja(0.08,d,0.4, MAT.yerba); panel.rotation.y=Math.PI/2; panel.position.y=alto_seguro(p.alto); g.add(panel);
        const luz = new THREE.PointLight(PAL.latonCalido, 0.6, 3);
        luz.position.set(0.3, p.alto, 0); g.add(luz);
        break; }
    }
    function alto_seguro(a){ return a; }

    if(p.solido){
      const caja3 = new THREE.Box3(
        new THREE.Vector3(p.x[0]-0.05, 0, p.z[0]-0.05),
        new THREE.Vector3(p.x[1]+0.05, h+0.3, p.z[1]+0.05)
      );
      cajasSolidas.push(caja3);
      if(p.id) muebleRefs[p.id] = { box:caja3, centro:new THREE.Vector3(cx,0,cz) };
    }
  });
}

  const bmD = caja(0.08,0.5,0.08, matRopa); bmD.position.y = -0.25; brazoD.add(bmD); g.add(brazoD);

  const piernaI = new THREE.Group(); piernaI.position.set(-0.1,0.75,0);
  const pmI = caja(0.09,0.6,0.09, new THREE.MeshStandardMaterial({color:"#33261C",roughness:0.9})); pmI.position.y=-0.3; piernaI.add(pmI); g.add(piernaI);

  g.traverse(o=>{ if(o.isMesh){ o.castShadow = true; } });
  g.userData.partes = { torso, cabeza, brazoI, brazoD, piernaI, piernaD };
  return g;
}

const esMovil = matchMedia("(pointer:coarse)").matches;

  joyEl.classList.add("activo");

  joyEl.addEventListener("pointermove", e=>{
    if(!joyActivo || e.pointerId!==joyId) return;
    const r = joyEl.getBoundingClientRect();
    let dx = e.clientX - (r.left+r.width/2), dy = e.clientY - (r.top+r.height/2);
    const max = r.width/2;
    const len = Math.min(Math.hypot(dx,dy), max);
    const ang = Math.atan2(dy,dx);
    dx = Math.cos(ang)*len; dy = Math.sin(ang)*len;
    joyPalo.style.transform = `translate(${dx-23}px, ${dy-23}px)`;
    joyVec = { x: dx/max, y: dy/max };
  });
  const soltarJoy = e=>{ if(e.pointerId!==joyId) return; joyActivo=false; joyVec={x:0,y:0}; joyPalo.style.transform="translate(-50%,-50%)"; };
  joyEl.addEventListener("pointerup", soltarJoy);

}

function moverAvatar(delta){
  if(dialogoAbierto) return;
  const correr = teclas["shift"];
  const vel = correr ? cfg.velCorrer : cfg.velCaminar;
  let dx=0, dz=0;

  // teclado: dirección relativa a cámara (adelante = donde mira la cámara)
  const dirCam = new THREE.Vector3(); camara.getWorldDirection(dirCam); dirCam.y=0; dirCam.normalize();
  const dirDer = new THREE.Vector3().crossVectors(dirCam, new THREE.Vector3(0,1,0)).multiplyScalar(-1);

  let adelante=0, lateral=0;
  if(teclas["w"]||teclas["arrowup"]) adelante+=1;
  if(teclas["s"]||teclas["arrowdown"]) adelante-=1;
  if(teclas["d"]||teclas["arrowright"]) lateral+=1;
  if(teclas["a"]||teclas["arrowleft"]) lateral-=1;
  if(joyVec.y) adelante -= joyVec.y;
  if(joyVec.x) lateral += joyVec.x;

  if(adelante || lateral){
    estadoAvatar.destino = null; // el teclado tiene prioridad sobre el click-to-move
    const mov = new THREE.Vector3().addScaledVector(dirCam, adelante).addScaledVector(dirDer, lateral);
    if(mov.lengthSq()>0){ mov.normalize(); dx = mov.x*vel*delta; dz = mov.z*vel*delta; }
  } else if(estadoAvatar.destino){
    const hacia = new THREE.Vector3().subVectors(estadoAvatar.destino, avatar.position); hacia.y=0;
    const dist = hacia.length();
    if(dist > 0.12){
      hacia.normalize();
      dx = hacia.x*cfg.velCaminar*delta; dz = hacia.z*cfg.velCaminar*delta;
    } else { estadoAvatar.destino = null; }
  }

  estadoAvatar.moviendo = !!(dx||dz);
  if(estadoAvatar.moviendo){
    const siguiente = new THREE.Vector3(avatar.position.x+dx,0,avatar.position.z+dz);
    if(!chocaAlgo(siguiente)) avatar.position.copy(siguiente);
    else {
      // desliza sobre el eje libre si uno de los dos choca
      const soloX = new THREE.Vector3(avatar.position.x+dx,0,avatar.position.z);
      const soloZ = new THREE.Vector3(avatar.position.x,0,avatar.position.z+dz);
      if(!chocaAlgo(soloX)) avatar.position.copy(soloX);
      else if(!chocaAlgo(soloZ)) avatar.position.copy(soloZ);
    }
    const mirar = new THREE.Vector3(avatar.position.x+dx, avatar.position.y, avatar.position.z+dz);
    if(mirar.distanceTo(avatar.position)>0.001) avatar.lookAt(mirar);
  }
  avatar.position.x = THREE.MathUtils.clamp(avatar.position.x, 0.4, cfg.anchoX-0.4);
  avatar.position.z = THREE.MathUtils.clamp(avatar.position.z, 0.4, cfg.profundoZ-0.4);
}

function animarCaminata(modelo, t, velocidad, activo){
  const partes = modelo.userData.partes;
  if(activo){
    const fase = t*velocidad*6;
    partes.brazoI.rotation.x = Math.sin(fase)*0.55;
    partes.brazoD.rotation.x = -Math.sin(fase)*0.55;
    partes.piernaI.rotation.x = -Math.sin(fase)*0.6;
    partes.piernaD.rotation.x = Math.sin(fase)*0.6;
    partes.torso.position.y = 1.02 + Math.abs(Math.sin(fase))*0.03;
  } else {
    partes.brazoI.rotation.x = THREE.MathUtils.lerp(partes.brazoI.rotation.x,0,0.1);
    partes.brazoD.rotation.x = THREE.MathUtils.lerp(partes.brazoD.rotation.x,0,0.1);
    partes.piernaI.rotation.x = THREE.MathUtils.lerp(partes.piernaI.rotation.x,0,0.1);
    partes.piernaD.rotation.x = THREE.MathUtils.lerp(partes.piernaD.rotation.x,0,0.1);
    partes.torso.scale.y = 1 + Math.sin(t*1.6)*0.015; // respiración sutil
  }
}

function moverPersonasAmbientales(delta, tGlobal){
  personas.forEach(per=>{
    if(per.sentado){
      animarCaminata(per.modelo, tGlobal+per.t0, 1, false);
      return;
    }
    if(tGlobal < per.pausaHasta){
      animarCaminata(per.modelo, tGlobal, per.vel, false);
      return;
    }
    const destino = per.puntos[per.idx];
    const objetivo = new THREE.Vector3(destino[0],0,destino[1]);
    const hacia = new THREE.Vector3().subVectors(objetivo, per.modelo.position); hacia.y=0;
    const dist = hacia.length();
    if(dist < 0.1){
      per.idx = (per.idx+1) % per.puntos.length;
      per.pausaHasta = tGlobal + 1 + Math.random()*2;
      animarCaminata(per.modelo, tGlobal, per.vel, false);
      return;
    }
    hacia.normalize();
    const paso = per.vel*delta;
    per.modelo.position.addScaledVector(hacia, Math.min(paso,dist));
    const mirar = new THREE.Vector3().copy(per.modelo.position).addScaledVector(hacia,1);
    per.modelo.lookAt(mirar);
    animarCaminata(per.modelo, tGlobal, per.vel, true);
  });
}

    o.material.emissive = new THREE.Color(PAL.latonCalido);
    o.material.emissiveIntensity = 0.35;
  }});
}
function restaurarEmissive(modelo){
  modelo.traverse(o=>{ if(o.isMesh && o.material && "emissive" in o.material){
    o.material.emissiveIntensity = o.userData._emissivePrevio ?? 0;
  }});
}

const miniCanvas = document.getElementById("minimapa");
const miniCtx = miniCanvas.getContext("2d");
const miniEscala = miniCanvas.width / cfg.anchoX;

function dibujarMinimapa(){
  const w = miniCanvas.width, h = cfg.profundoZ*miniEscala;
  miniCanvas.height = h;
  miniCtx.clearRect(0,0,w,h);
  miniCtx.fillStyle = "#20140c"; miniCtx.fillRect(0,0,w,h);

  ZONAS.forEach(zn=>{
    miniCtx.fillStyle = zn.piso;
    miniCtx.globalAlpha = 0.9;
    miniCtx.fillRect(zn.x[0]*miniEscala, zn.z[0]*miniEscala, ancho(zn.x)*miniEscala, ancho(zn.z)*miniEscala);
  });
  miniCtx.globalAlpha = 1;
  miniCtx.strokeStyle = "rgba(0,0,0,.25)"; miniCtx.lineWidth = 1;
  miniCtx.strokeRect(0,0,w,h);

  // personas ambientales
  personas.forEach(per=>{
    miniCtx.fillStyle = "rgba(46,36,29,.75)";
    miniCtx.beginPath();
    miniCtx.arc(per.modelo.position.x*miniEscala, per.modelo.position.z*miniEscala, 2.2, 0, Math.PI*2);
    miniCtx.fill();
  });
  // NPCs fijos
  npcObjetos.forEach(n=>{
    miniCtx.fillStyle = PAL.latonCalido;
    miniCtx.beginPath();
    miniCtx.arc(n.pos.x*miniEscala, n.pos.z*miniEscala, 2.8, 0, Math.PI*2);
    miniCtx.fill();
  });
  // visitante
  miniCtx.fillStyle = "#D9A441";
  miniCtx.strokeStyle = "#fff"; miniCtx.lineWidth = 1.5;
  miniCtx.beginPath();
  miniCtx.arc(avatar.position.x*miniEscala, avatar.position.z*miniEscala, 4, 0, Math.PI*2);
  miniCtx.fill(); miniCtx.stroke();
}

let listo = false;
function animar(){
  requestAnimationFrame(animar);
  const delta = Math.min(reloj.getDelta(), 0.05);
  const t = reloj.getElapsedTime();

  moverAvatar(delta);
  animarCaminata(avatar, t, estadoAvatar.moviendo?1.35:1, estadoAvatar.moviendo);
  moverPersonasAmbientales(delta, t);

  npcObjetos.forEach(n=>{
    n.indicador.position.y = 2.05 + Math.sin(t*1.6)*0.08;
    n.indicador.rotation.y += delta*1.1;
  });

  actualizarLetreroZona();
  chequearCercaniaNPC();
  actualizarHover();
  actualizarCamara();
  dibujarMinimapa();

  renderer.render(escena, camara);

  if(!listo){ listo = true; finalizarCarga(); }
}

function finalizarCarga(){
  paso(100,"Listo");
  setTimeout(()=> document.getElementById("carga").classList.add("oculto"), 350);
}

paso(92,"Poblando el local…");
requestAnimationFrame(()=>{ paso(98,"Últimos detalles…"); animar(); });

/* ============================================================
   LIMPIEZA DE RECURSOS
   ============================================================ */
window.addEventListener("beforeunload", ()=>{
  escena.traverse(o=>{
    if(o.isMesh){
      o.geometry?.dispose();
      if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
      else o.material?.dispose();
    }
  });
  renderer.dispose();
});
</script>
